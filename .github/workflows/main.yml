name: Telegram_Automation_Final

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Install_Dependencies
        run: pip install telethon

      - name: Execute_Full_Script
        run: |
          cat << 'EOF' > my_bot.py
# -*- coding: utf-8 -*-
import asyncio, time, os, glob, random
from telethon import TelegramClient, events, Button
from telethon.sessions import StringSession
from telethon.errors import FloodWaitError, MessageNotModifiedError, UserDeactivatedError

OWNER_ID = 6762940512
bot_token = "8520006260:AAGWatChzdHGXhZILav0gqX3Jn91NDzj1fg"

is_paused = False
account_logs = {}
last_success_list = []
replied_users = {}
reply_queue = asyncio.Queue()

def init_log(name):
    account_logs[name] = {'unique_ids': set(), 'total_count': 0, 'failed_count': 0, 'last_fail_reason': 'لا يوجد', 'status': 'نشط ✅', 'pause_until': 0}

sessions_config = [
    {'name': 'الجلسة الجديدة 1', 'id': 35234215, 'hash': '2f560ad5ac9a1c11b8582e42471c403c', 'str': '1BJWap1sBu5QxQPXDKdwMTJiQfyh9KD8cRE4pUghL9slakYFyvUUFTRcnN4xvUPEd6F-y01Mv2EkwTonZJpWO7Dsm3eMYhx11hntNpTwAPMz--Jv2_nZLQMzWl62Ssdi7c2FlhtMvr5f3wyE5IW2ocnAtvfVzUTs59hTh9cXwlMuoHzyYCYYibA2AadPuLjIOflMfmHa-JrMdAvCwSUe0_T6TtA5D8USSW_4ps7Y_B7rjDLbHvsVxZtzcBjGzJmGytxV0kyzsE_8luEJvxdUganOtyeBMKboIIByfou_uLWuF7QyYaCKspW422iHlmIHByJ_GZeI_Rrsy6c2w5Atr4BgIwHQlQ6M='},
    {'name': 'الجلسة الجديدة 2', 'id': 39838472, 'hash': '39e0757f5b96e8a84c7797c17d28c29a', 'str': '1BJWap1sBu6F1feEVYtqx1o_ImLPmDXsjDKfL2q4nhfLm1BRYg_RpFRz-KHG9XV67qeBMmBuwusFA1YXF62GHSYDQtgx1fdy0eNy-_nQinIQHvnsMHEKdEpurPDuw9d_FmUTp2QrXj10qgWAs0XG6jRGAbqnzFNHJXnFHNgvm-tiIicwYflF_AeGiEZNc1mYZ832sQrReBdJ-g7eLYbpqSC7j3XLuylrZdxdc7eTJLURe78mHN1-y_4tPquvAULVtfl6REAaVR1zzYOfHiWojZzRPSGqAxj6dRZKGeM2lIpUL_1O6rAUUc49KJJlNgTBG5HF_xOx9qSa3DEQIhQlUiJpohQZBGuA='}
]

MY_IDS = [s['id'] for s in sessions_config]
target_links = ['https://t.me/+z7K5sSzvWQU3NTAy', 'https://t.me/pewndgrop', 'https://t.me/M_R515', 'https://t.me/+wtGW0icU0pY2YWY0', 'https://t.me/krkokgrop']
replies_khas = ["وين رايحين، التبادلات مضيعة للوقت يخوي، عندي لك رابط بوت كله مقاطع نار نار، رابطو بوصف حسابي نار.", "ليش الخاص يحلوين، روحو البوت رابطوو بوصف حسابي", "ليش تتعب حالك بالخاص وهيك، روح البوت رابطو بوصف حسابي لاتفوت الفرصه شوي واحذفه"]
replies_tabadel = ["تبغا مقاطع ورعان ياصاحبي، معي بوت بوصف حسابي فيه 30 الف مقطع", "التبادلات تعب، عندي لك بوت بوصف حسابي ببلاش ورعان من كل الجنسيات", "مقاطع ورعان اخر موديل، البوت بوصف حسابي وقول للتبادلات باي باي", "خش البوت حقي من وصف حسابي وعيش الجو مع الورعان اخر دقه", "ضفت اكثر من 31 الف مقطع ورع عندي بالبوت بوصف حسابي لو تريد"]

idx_khas = 0
idx_tabadel = 0

async def worker(client, account_name):
    global is_paused, last_success_list, idx_khas, idx_tabadel
    while True:
        try:
            event, reply_text, retry_count = await reply_queue.get()
            if is_paused:
                await asyncio.sleep(1)
                await reply_queue.put((event, reply_text, retry_count))
                reply_queue.task_done()
                continue
            if time.time() < account_logs[account_name]['pause_until']:
                await reply_queue.put((event, reply_text, retry_count))
                await asyncio.sleep(2)
                reply_queue.task_done()
                continue
            await client.send_message(event.chat_id, reply_text, reply_to=event.id)
            account_logs[account_name]['total_count'] += 1
            account_logs[account_name]['unique_ids'].add(event.sender_id)
            account_logs[account_name]['status'] = 'نشط ✅'
            try:
                chat = await client.get_entity(event.chat_id)
                g_title = chat.title if hasattr(chat, 'title') else "قروب"
            except: g_title = "غير معروف"
            last_success_list.insert(0, f"🕒 {time.strftime('%H:%M')} | {account_name} ➜ {g_title}")
            if len(last_success_list) > 5: last_success_list.pop()
            print(f"✅ [{account_name}] نجح في الرد.")
            await asyncio.sleep(random.uniform(15, 20))
        except FloodWaitError as e:
            account_logs[account_name]['status'] = f'مقيد ({e.seconds}ث)'
            account_logs[account_name]['pause_until'] = time.time() + e.seconds
            await reply_queue.put((event, reply_text, retry_count))
        except Exception as e:
            account_logs[account_name]['failed_count'] += 1
            if retry_count < 2: await reply_queue.put((event, reply_text, retry_count + 1))
        finally:
            reply_queue.task_done()

async def main():
    global idx_khas, idx_tabadel, is_paused
    clients = []
    control_bot = TelegramClient(StringSession(), sessions_config[0]['id'], sessions_config[0]['hash'])
    await control_bot.start(bot_token=bot_token)
    print("🔍 جاري تشغيل الحسابات الجديدة...")
    for s_info in sessions_config:
        client = TelegramClient(StringSession(s_info['str']), s_info['id'], s_info['hash'], connection_retries=20, retry_delay=5)
        try:
            await client.start()
            me = await client.get_me()
            real_name = f"{me.first_name} {me.last_name or ''}".strip() or "."
            init_log(real_name)
            clients.append(client)
            asyncio.create_task(worker(client, real_name))
            print(f"🚀 متصل الآن: [{real_name}]")
        except Exception as e: print(f"❌ خطأ في {s_info['name']}: {e}")

    @control_bot.on(events.CallbackQuery())
    async def catcher(event):
        try:
            data = event.data
            if data == b"report":
                report_msg = "📝 **التقرير التفصيلي**\n━━━━━━━━━━━━━━━━━━\n"
                all_uniques = set(); all_totals = 0
                for name, log in account_logs.items():
                    uniques = len(log['unique_ids'])
                    all_uniques.update(log['unique_ids']); all_totals += log['total_count']
                    status = log['status']
                    if log['pause_until'] > time.time(): status = f"مقيد ({int(log['pause_until']-time.time())}ث)"
                    report_msg += f"👤 **{name}**\n  ├ {status}\n  └ فريد: {uniques} | كلي: {log['total_count']}\n"
                report_msg += f"━━━━━━━━━━━━━━━━━━\n🏆 فريد: {len(all_uniques)} | 📈 إجمالي: {all_totals}"
                await event.edit(report_msg, buttons=[[Button.inline("🔄 تحديث", b"report")], [Button.inline("🔙 رجوع", b"back")]])
            elif data == b"last_replies":
                msg = "🕒 **آخر 5 ردود ناجحة:**\n━━━━━━━━━━━━━━\n" + ("\n".join(last_success_list) if last_success_list else "لا يوجد سجل.")
                await event.edit(msg, buttons=[[Button.inline("🔄 تحديث", b"last_replies")], [Button.inline("🔙 رجوع", b"back")]])
            elif data == b"toggle":
                global is_paused
                is_paused = not is_paused
                await event.answer(f"تم {'الإيقاف' if is_paused else 'الاستئناف'}")
                await event.edit("🕹️ **لوحة التحكم:**", buttons=[[Button.inline("📊 تقرير عن الحسابات", b"report")],[Button.inline("🕒 آخر الردود بأي قروب", b"last_replies")],[Button.inline("⏸️ توقف مؤقت" if not is_paused else "▶️ استئناف العمل", b"toggle")]])
            elif data == b"back":
                await event.edit("🕹️ **لوحة التحكم:**", buttons=[[Button.inline("📊 تقرير عن الحسابات", b"report")],[Button.inline("🕒 آخر الردود بأي قروب", b"last_replies")],[Button.inline("⏸️ توقف مؤقت" if not is_paused else "▶️ استئناف العمل", b"toggle")]])
        except Exception: pass

    @control_bot.on(events.NewMessage(pattern='تحكم', from_users=OWNER_ID))
    async def cmd_control(event):
        await event.reply("🕹️ **لوحة التحكم المتقدمة:**", buttons=[[Button.inline("📊 تقرير عن الحسابات", b"report")],[Button.inline("🕒 آخر الردود بأي قروب", b"last_replies")],[Button.inline("⏸️ توقف مؤقت" if not is_paused else "▶️ استئناف العمل", b"toggle")]])

    resolved_ids = []
    for link in target_links:
        for client in clients:
            try:
                entity = await client.get_entity(link)
                resolved_ids.append(entity.id)
                break
            except: continue

    @clients[0].on(events.NewMessage(chats=list(set(resolved_ids))))
    async def handler(event):
        global idx_khas, idx_tabadel, is_paused
        if is_paused or event.sender_id in MY_IDS: return
        if event.sender_id in replied_users and (time.time() - replied_users[event.sender_id] < 7200): return
        text = (event.text or "").strip()
        reply_msg = None
        if "خاص" in text:
            reply_msg = replies_khas[idx_khas]; idx_khas = (idx_khas + 1) % len(replies_khas)
        elif any(w in text for w in ["تبادل", "ورعان", "ورع", "صغار"]):
            reply_msg = replies_tabadel[idx_tabadel]; idx_tabadel = (idx_tabadel + 1) % len(replies_tabadel)
        if reply_msg:
            replied_users[event.sender_id] = time.time()
            await reply_queue.put((event, reply_msg, 0))

    print("✅ النظام يعمل الآن بالجلسات الجديدة.")
    await asyncio.gather(control_bot.run_until_disconnected(), *(c.run_until_disconnected() for c in clients))

if __name__ == '__main__':
    asyncio.run(main())
EOF
          python3 my_bot.py
